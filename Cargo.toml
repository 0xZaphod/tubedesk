[package]
name = "tubedesk"
version = "0.3.1"
edition = "2021"
description = "Lightweight, audio-only YouTube Music desktop client built on Tauri"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
rustypipe = { version = "0.11", features = ["userdata"] }
reqwest = { version = "0.12", features = ["stream", "blocking"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time", "process"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8"
log = "0.4"
env_logger = "0.11"
symphonia = { version = "0.5", default-features = false, features = ["mkv"] }
opus = "0.3"
cpal = "0.15"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

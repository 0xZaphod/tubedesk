name: Build

# A pushed tag like v0.3.0 builds every platform and attaches the bundles to
# a draft release. "Run workflow" (manual) only builds and keeps the bundles
# as downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the AppImage then runs on older
          # distributions too (it needs at least this glibc).
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - platform: windows-latest
            args: --bundles nsis,msi
          # One app for both Intel and Apple Silicon Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libopus-dev libdbus-1-dev patchelf

      # Windows and macOS: libopus is built from source (with CMake) and
      # linked statically, so the app doesn't need it installed.
      - name: Build libopus from source
        if: runner.os != 'Linux'
        shell: bash
        run: echo "LIBOPUS_NO_PKG=1" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's strip can fail on newer binaries; stripping is done by cargo anyway.
          NO_STRIP: "true"
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('TubeDesk {0}', github.ref_name) || '' }}
          # Shown in the draft release; edit it there before publishing.
          releaseBody: |
            An unofficial, lightweight desktop client for YouTube Music.

            **Requirements:** yt-dlp and deno must be installed (see the README).

            **Windows and macOS builds are untested.** They are built automatically but
            have not been tried on a real Windows or Mac machine yet. Please open an
            issue if something doesn't work. The builds are unsigned: Windows SmartScreen
            and macOS Gatekeeper will warn on first start (macOS: right-click the app → Open).
          releaseDraft: true

      - name: Keep the bundles (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tubedesk-${{ matrix.platform }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

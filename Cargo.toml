[package]
name = "tubedesk"
version = "0.1.0"
edition = "2021"
description = "Lightweight YouTube / YouTube Music desktop wrapper built on Tauri"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
adblock = { version = "0.13", features = ["content-blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
webkit2gtk-sys = { version = "2.0", features = ["v2_24"] }
glib = "0.18"
glib-sys = "0.18"
gio-sys = "0.18"
gobject-sys = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

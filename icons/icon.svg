<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TubeDesk icon: an original design (beamed notes on a gradient tile). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#0E9F8E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
  <g fill="#ffffff">
    <!-- beam -->
    <path d="M414 318 L716 254 L716 344 L414 408 Z"/>
    <!-- stems -->
    <rect x="414" y="330" width="40" height="370"/>
    <rect x="676" y="270" width="40" height="370"/>
    <!-- note heads -->
    <ellipse cx="366" cy="708" rx="100" ry="76" transform="rotate(-22 366 708)"/>
    <ellipse cx="628" cy="648" rx="100" ry="76" transform="rotate(-22 628 648)"/>
  </g>
</svg>

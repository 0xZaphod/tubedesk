<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-head">
        <button id="sidebar-toggle" class="icon" title="Hide sidebar" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button>
        <span class="brand">TubeDesk</span>
      </div>
      <button class="nav" data-view="home">Home</button>
      <div class="nav-label">Library</div>
      <button class="nav" data-view="playlists">Playlists</button>
      <button class="nav" data-view="albums">Albums</button>
      <button class="nav" data-view="artists">Artists</button>
      <button class="nav" data-view="history">History</button>
      <div class="spacer"></div>
      <button class="nav" data-view="account" id="account-nav">Account</button>
    </nav>

    <main id="main">
      <header id="topbar">
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Search songs, albums, artists" autocomplete="off">
        </form>
      </header>
      <section id="view"></section>
    </main>

    <aside id="queue" hidden>
      <div class="queue-head">
        <h2>Queue</h2>
        <button id="queue-clear" class="text">Clear</button>
      </div>
      <ol id="queue-list"></ol>
    </aside>

    <footer id="playerbar">
      <div class="np">
        <img id="np-cover" alt="">
        <div class="np-text">
          <div id="np-title" class="ellipsis">Nothing playing</div>
          <div id="np-artist" class="ellipsis muted"></div>
        </div>
      </div>
      <div class="transport">
        <div class="buttons">
          <button id="prev" class="icon" title="Previous" aria-label="Previous">⏮</button>
          <button id="toggle" class="icon big" title="Play/Pause" aria-label="Play or pause">▶</button>
          <button id="next" class="icon" title="Next" aria-label="Next">⏭</button>
        </div>
        <div class="seek">
          <span id="pos" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek">
          <span id="dur" class="time">0:00</span>
        </div>
      </div>
      <div class="extras">
        <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
        <button id="queue-btn" class="icon" title="Queue" aria-label="Toggle queue">☰</button>
      </div>
    </footer>
  </div>
  <div id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>

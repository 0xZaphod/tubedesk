<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Custom title bar: drag to move, double-click to maximise. -->
    <header id="titlebar" data-tauri-drag-region>
      <img class="titlebar-icon" src="icon.png" alt="" data-tauri-drag-region>
      <span id="titlebar-title" class="ellipsis" data-tauri-drag-region>TubeDesk</span>
      <div class="window-controls">
        <button id="win-min" class="win-btn" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg>
        </button>
        <button id="win-max" class="win-btn" title="Maximise" aria-label="Maximise">
          <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
        </button>
        <button id="win-close" class="win-btn close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
      </div>
    </header>

    <nav id="sidebar">
      <div class="sidebar-head">
        <button id="sidebar-toggle" class="icon" title="Hide sidebar" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button>
        <span class="brand">TubeDesk</span>
      </div>
      <button class="nav" data-view="home" title="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span class="label">Home</span></button>
      <div class="nav-label">Library</div>
      <button class="nav" data-view="playlists" title="Playlists"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12M3 12h12M3 18h7"/><circle cx="17" cy="18" r="3"/><path d="M20 18V7l2-1"/></svg><span class="label">Playlists</span></button>
      <button class="nav" data-view="albums" title="Albums"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg><span class="label">Albums</span></button>
      <button class="nav" data-view="artists" title="Artists"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><span class="label">Artists</span></button>
      <button class="nav" data-view="history" title="History"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span class="label">History</span></button>
      <div class="spacer"></div>
      <!-- Shown when a new version is available. -->
      <button id="update-btn" class="nav update-nav" hidden title="A new version of TubeDesk is available"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg><span class="label">Update</span></button>
      <button class="nav" data-view="settings" title="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="label">Settings</span></button>
      <button class="nav" data-view="account" id="account-nav" title="Account"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2 3.2-3 5.5-3s4.3 1 5.5 3"/></svg><span class="label">Account</span></button>
    </nav>

    <main id="main">
      <header id="topbar">
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Search songs, albums, artists  (Ctrl+F)" autocomplete="off">
        </form>
      </header>
      <section id="view"></section>
      <!-- Now playing: large cover over the main area (click the cover in the player bar). -->
      <section id="nowplaying" hidden aria-label="Now playing">
        <img id="npv-backdrop" alt="" aria-hidden="true">
        <button id="npv-close" class="icon" title="Close (Esc)" aria-label="Close now playing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="npv-body">
          <img id="npv-cover" alt="">
          <div class="npv-text">
            <h1 id="npv-title" class="ellipsis"></h1>
            <div id="npv-artist" class="ellipsis"></div>
            <div id="npv-album" class="ellipsis muted"></div>
          </div>
        </div>
      </section>
    </main>

    <aside id="queue" hidden>
      <div class="queue-head">
        <h2>Queue</h2>
        <button id="queue-clear" class="text">Clear</button>
      </div>
      <ol id="queue-list"></ol>
    </aside>

    <footer id="playerbar">
      <div class="np">
        <button id="np-open" class="np-open" title="Now playing" aria-label="Show now playing"><img id="np-cover" alt=""></button>
        <div class="np-text">
          <div id="np-title" class="ellipsis">Nothing playing</div>
          <div id="np-artist" class="ellipsis muted"></div>
        </div>
      </div>
      <div class="transport">
        <div class="buttons">
          <button id="shuffle" class="icon mode" title="Shuffle (S)" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.6 0 2.7-.6 3.6-1.7M14.4 8.7c.9-1.1 2-1.7 3.1-1.7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
          </button>
          <button id="prev" class="icon" title="Previous (Ctrl+←)" aria-label="Previous">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5.5v13a.6.6 0 0 1-.9.5L9 12.5a.6.6 0 0 1 0-1L18.1 5a.6.6 0 0 1 .9.5z"/></svg>
          </button>
          <button id="toggle" class="icon big" title="Play/Pause (Space)" aria-label="Play or pause">
            <svg class="glyph play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10.2-6.4a.8.8 0 0 0 0-1.4L9.2 4.9A.8.8 0 0 0 8 5.6z"/></svg>
            <svg class="glyph pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
          </button>
          <button id="next" class="icon" title="Next (Ctrl+→)" aria-label="Next">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM5 5.5v13a.6.6 0 0 0 .9.5l9.1-6.5a.6.6 0 0 0 0-1L5.9 5a.6.6 0 0 0-.9.5z"/></svg>
          </button>
          <button id="repeat" class="icon mode" title="Repeat (R)" aria-label="Repeat" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20M7 21l-3-3 3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/></svg>
            <span class="badge" hidden>1</span>
          </button>
        </div>
        <div class="seek">
          <span id="pos" class="time">0:00</span>
          <div class="seekbar">
            <canvas id="seek-canvas" aria-hidden="true"></canvas>
            <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek">
          </div>
          <span id="dur" class="time">0:00</span>
        </div>
      </div>
      <div class="extras">
        <div class="np-actions" hidden>
          <button id="like" class="icon small" title="Like" aria-label="Like" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2.5 2.2L13 9h5.5a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17.1 20H7"/></svg>
          </button>
          <button id="dislike" class="icon small" title="Dislike" aria-label="Dislike" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 13V4h3v9zM17 13l-4 8a2 2 0 0 1-2.5-2.2L11 15H5.5a2 2 0 0 1-2-2.4l1.4-7A2 2 0 0 1 6.9 4H17"/></svg>
          </button>
          <div class="add-wrap">
            <button id="add-to-playlist" class="icon small" title="Add to playlist" aria-label="Add to playlist" aria-haspopup="menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12M3 12h12M3 18h7M18 14v8M14 18h8"/></svg>
            </button>
            <div id="playlist-menu" class="menu" role="menu" hidden></div>
          </div>
        </div>
        <button id="mute" class="icon small" title="Mute (M)" aria-label="Mute">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="vol-body" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="vol-wave1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="vol-wave2" d="M18 7a7 7 0 0 1 0 10"/><path class="vol-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
        <button id="queue-btn" class="icon small" title="Queue" aria-label="Show queue" aria-pressed="false" aria-controls="queue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h13M3 11h13M3 16h7M15 14.5v6l5-3z"/></svg>
        </button>
      </div>
    </footer>
  </div>
  <div id="toast" role="status" hidden></div>
  <!-- Resize handles (the window has no system frame). -->
  <div class="resize" data-dir="North"></div><div class="resize" data-dir="South"></div>
  <div class="resize" data-dir="West"></div><div class="resize" data-dir="East"></div>
  <div class="resize" data-dir="NorthWest"></div><div class="resize" data-dir="NorthEast"></div>
  <div class="resize" data-dir="SouthWest"></div><div class="resize" data-dir="SouthEast"></div>
  <script src="app.js"></script>
</body>
</html>
